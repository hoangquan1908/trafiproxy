<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trafexia-lite | Network Debugger</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="topbar">
        <div class="left">
            <span class="logo">TRAFEXIA</span>
            <div class="divider"></div>
            <div class="port-config">
                <label for="portInput">Port:</label>
                <input type="number" id="portInput" value="8888" min="1024" max="65535">
            </div>
            <button id="interceptBtn" class="btn">OFF Intercept</button>
            <button id="stopBtn" class="btn stop" style="background-color:#166534;">▶ Start Proxy</button>
            <span id="status" class="status stopped">● Stopped</span>
            <span class="address">127.0.0.1:----</span>
        </div>

        <div class="right">
            <span id="reqCount" class="badge-count">0 requests</span>

            <select id="methodFilter" class="filter-select" onchange="renderTable()">
                <option value="ALL">All Methods</option>
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
                <option value="OPTIONS">OPTIONS</option>
            </select>
            <select id="statusFilter" class="filter-select" onchange="renderTable()">
                <option value="ALL">All Status</option>
                <option value="2xx">2xx</option>
                <option value="3xx">3xx</option>
                <option value="4xx">4xx</option>
                <option value="5xx">5xx</option>
            </select>

            <div class="search-box">
                <input id="filterInput" type="text" placeholder="Filter host, path...">
            </div>

            <div class="export-dropdown">
                <button class="icon" onclick="toggleExportMenu()">⬇ Export</button>
                <div class="export-menu" id="exportMenu" style="display:none;">
                    <button onclick="exportHAR();toggleExportMenu()">HAR file</button>
                    <button onclick="exportPostman();toggleExportMenu()">Postman Collection</button>
                    <button onclick="exportPython();toggleExportMenu()">Python requests</button>
                </div>
            </div>

            <button id="clearBtn" class="icon" title="Clear All Traffic">🗑</button>
            <button class="icon" title="Settings" onclick="openSettings()">⚙</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="table-container">
                <table id="traffic-table">
                    <thead>
                        <tr>
                            <th width="50">ID</th>
                            <th width="85">TIME</th>
                            <th width="80">METHOD</th>
                            <th width="180">HOST</th>
                            <th>PATH</th>
                            <th width="70">STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="traffic-body"></tbody>
                </table>
            </div>
        </div>

        <div class="resizer" id="dragMe"></div>

        <div class="detail" id="detail-panel">
            <!-- Header với nút X -->
            <div class="detail-header-fixed">
                <h3>Request Detail</h3>
                <button class="detail-close-btn" onclick="toggleDetail()" title="Đóng panel">✕</button>
            </div>
            <div id="detail-content">
                <div class="welcome-msg"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function toggleExportMenu() {
            const m = document.getElementById("exportMenu");
            m.style.display = m.style.display === "none" ? "block" : "none";
        }
        document.addEventListener("click", (e) => {
            if (!e.target.closest(".export-dropdown"))
                document.getElementById("exportMenu").style.display = "none";
        });
    </script>
</body>
</html>
